[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrift"
version = "0.1.3"
description = "Exact-oracle correctness checker for affine INT8 quantization arithmetic: round-to-nearest-even boundaries and cross-scale element-wise add requantization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/qdrift"
Issues = "https://github.com/zhuhroscar-tech/qdrift/issues"
Changelog = "https://github.com/zhuhroscar-tech/qdrift/blob/main/CHANGELOG.md"

[project.scripts]
qdrift = "qdrift.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
